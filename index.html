<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUÁN NƯỚNG TUỔI TRẺ - Đăng nhập</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #ff9800;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2b2b2b;
            color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="password"]:focus {
            border-color: #ff9800;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔥 QUÁN NƯỚNG TUỔI TRẺ 🔥</h2>
        <p style="font-size: 14px; color: #aaa; margin-bottom: 15px;">Nhập mã PIN quản lý để tiếp tục</p>
        
        <div class="input-group">
            <input type="password" id="pinInput" placeholder="••••" maxlength="6" autofocus>
        </div>
        
        <button id="loginBtn">ĐĂNG NHẬP THIẾT BỊ</button>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', handleLogin);
        document.getElementById('pinInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });

        async function handleLogin() {
            const enteredPin = document.getElementById('pinInput').value.trim();

            if (!enteredPin) {
                alert('Vui lòng nhập mã PIN!');
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ pin: enteredPin })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Đăng nhập thành công, chuyển hướng vào trang quản lý chính của quán 
                    // (Bạn hãy thay 'quanly.html' thành đúng tên file quản lý thực tế trong dự án nếu cần)
                    window.location.href = '/quanly.html'; 
                } else {
                    alert(data.message || 'Sai mã PIN!');
                }
            } catch (err) {
                console.error('Lỗi:', err);
                alert('Lỗi kết nối máy chủ!');
            }
        }
    </script>
</body>
</html>
