<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUÁN NƯỚNG TUỔI TRẺ - Gọi Món Theo Lượt</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; margin: 0; padding: 10px; }
        
        /* THANH ĐIỀU HƯỚNG */
        .top-nav { display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; max-width: 500px; margin-left: auto; margin-right: auto; }
        .top-nav h1 { color: #ff9800; margin: 0; font-size: 15px; }
        .nav-btn { background: #ff9800; color: #121212; border: none; padding: 5px 10px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 11px; }

        /* GIAO DIỆN APP DỌC */
        #appView { max-width: 500px; margin: 0 auto; background: #1e1e1e; color: #fff; padding: 12px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .mobile-header { text-align: center; color: #ff9800; font-weight: bold; font-size: 16px; margin-bottom: 8px; }
        
        .food-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; max-height: 280px; overflow-y: auto; padding-right: 4px; }
        .food-card { background: #2b2b2b; border: 1px solid #444; padding: 6px; border-radius: 6px; text-align: center; cursor: pointer; }
        .food-card:hover { border-color: #ff9800; background: #333; }
        .food-name { font-size: 11px; font-weight: bold; margin-bottom: 3px; height: 28px; overflow: hidden; color: #fff; }
        .food-price { color: #ff9800; font-weight: bold; font-size: 12px; }

        .category-title { font-size: 12px; font-weight: bold; color: #ffa726; margin: 6px 0 3px 0; text-transform: uppercase; }
        
        /* PHIẾU GỌI MÓN THEO LƯỢT */
        .bill-box { background: #2b2b2b; padding: 8px; border-radius: 6px; max-height: 200px; overflow-y: auto; margin-bottom: 8px; font-size: 12px; border: 1px solid #444; }
        .round-title { color: #03a9f4; font-weight: bold; margin-top: 6px; border-bottom: 1px dashed #555; padding-bottom: 2px; }
        
        .action-btns { display: flex; gap: 6px; }
        .submit-btn { flex: 1; background: #ff9800; color: #121212; border: none; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .checkout-btn { flex: 1; background: #d32f2f; color: white; border: none; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; }

        /* MODAL CÀI ĐẶT */
        #settingsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: #222; padding: 15px; border-radius: 8px; width: 280px; text-align: center; border: 1px solid #ff9800; }
        .modal-content button { width: 100%; margin-top: 8px; padding: 8px; background: #ff9800; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- THANH ĐIỀU HƯỚNG -->
    <div class="top-nav">
        <h1>🔥 QUÁN NƯỚNG TUỔI TRẺ</h1>
        <div>
            <button class="nav-btn" onclick="openSettings()">⚙️ Cài Đặt</button>
            <button class="nav-btn" style="background:#4caf50; color:#fff;" onclick="viewRevenue()">📊 Doanh Thu</button>
        </div>
    </div>

    <!-- GIAO DIỆN APP DỌC -->
    <div id="appView">
        <div class="mobile-header">QUẢN LÝ GỌI MÓN THEO LƯỢT</div>
        
        <div style="display: flex; gap: 6px; margin-bottom: 8px;">
            <div style="flex: 1;">
                <label style="font-size: 11px; color: #aaa;">Chọn bàn:</label>
                <select id="selectedTable" onchange="changeTable()" style="width: 100%; padding: 6px; background: #2b2b2b; color: #fff; border: 1px solid #555; border-radius: 4px; font-weight: bold; font-size: 12px;">
                    <option value="">-- Chọn bàn --</option>
                    <script>
                        for(let i=1; i<=16; i++) document.write(`<option value="Bàn ${i}">Bàn ${i}</option>`);
                    </script>
                </select>
            </div>
            <div style="flex: 1;">
                <label style="font-size: 11px; color: #aaa;">Lượt gọi hiện tại:</label>
                <div id="currentRoundText" style="padding: 6px; background: #333; color: #03a9f4; font-weight: bold; border-radius: 4px; font-size: 12px; text-align: center;">Lượt 1</div>
            </div>
        </div>

        <div class="category-title" style="color: #ff9800;">DANH MỤC THỰC ĐƠN</div>
        <div class="food-grid" id="foodGrid"></div>

        <div style="font-weight: bold; margin-bottom: 3px; font-size: 12px;">📋 Phiếu Gọi Món (Đã phân theo lượt):</div>
        <div class="bill-box" id="billContent">
            <p style="color: #aaa; text-align: center; margin-top: 15px; font-size: 11px;">Chưa chọn bàn hoặc chưa có món</p>
        </div>
        
        <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; margin-bottom: 8px;">
            <span>Tổng cộng:</span>
            <span id="totalPrice" style="color: #ff9800;">0đ</span>
        </div>
        
        <div class="action-btns">
            <button class="submit-btn" onclick="submitNewRound()">🚀 Chốt Lượt Mới</button>
            <button class="checkout-btn" onclick="checkout()">💳 Thanh Toán</button>
        </div>
    </div>

    <!-- BẢNG CÀI ĐẶT -->
    <div id="settingsModal">
        <div class="modal-content">
            <h3 style="color: #ff9800; margin-top:0; font-size: 14px;">⚙️ Cài Đặt Hệ Thống</h3>
            <button onclick="viewRevenue()" style="background:#4caf50; color:#fff;">Xem Doanh Thu Ngày</button>
            <button onclick="closeSettings()" style="background:#d32f2f; color:#fff;">Đóng</button>
        </div>
    </div>

    <script>
        const menuList = [
            { category: "COMBO SIÊU HÓT", name: "Combo 2-3 người", price: 319000 },
            { category: "COMBO SIÊU HÓT", name: "Combo 3-4 người", price: 459000 },
            { category: "COMBO SIÊU HÓT", name: "Combo 4-6 người", price: 619000 },
            { category: "COMBO SIÊU HÓT", name: "Combo nhiều người", price: 1199000 },
            { category: "ĐỒ ĂN NHẸ", name: "Hoa quả thập cẩm", price: 29000 },
            { category: "ĐỒ ĂN NHẸ", name: "Ngô chiên", price: 35000 },
            { category: "ĐỒ ĂN NHẸ", name: "Bánh mỳ nướng bơ", price: 19000 },
            { category: "ĐỒ ĂN NHẸ", name: "Khoai tây chiên", price: 35000 },
            { category: "ĐỒ ĂN NHẸ", name: "Salad rau tổng hợp", price: 29000 },
            { category: "ĐỒ ĂN NHẸ", name: "Salad hoa quả", price: 39000 },
            { category: "ĐỒ ĂN NHẸ", name: "Kim chi Hàn Quốc", price: 29000 },
            { category: "CÁC MÓN NƯỚNG", name: "Ba chỉ", price: 65000 },
            { category: "CÁC MÓN NƯỚNG", name: "Sụn non ướp ngũ vị", price: 69000 },
            { category: "CÁC MÓN NƯỚNG", name: "Nầm tươi ứa sữa", price: 75000 },
            { category: "CÁC MÓN NƯỚNG", name: "Bò cuộn nấm kim", price: 59000 },
            { category: "CÁC MÓN NƯỚNG", name: "Thịt dải heo", price: 69000 },
            { category: "CÁC MÓN NƯỚNG", name: "Má đào heo", price: 79000 },
            { category: "CÁC MÓN NƯỚNG", name: "Nọng má tươi", price: 79000 },
            { category: "CÁC MÓN NƯỚNG", name: "Chân gà rút xương", price: 99000 },
            { category: "CÁC MÓN NƯỚNG", name: "Lòng non", price: 59000 },
            { category: "CÁC MÓN NƯỚNG", name: "Khâu đuôi giòn sần sật", price: 69000 },
            { category: "CÁC MÓN NƯỚNG", name: "Lòng già mũm mĩm", price: 59000 },
            { category: "CÁC MÓN NƯỚNG", name: "Dạ dày nướng xa tê", price: 69000 },
            { category: "CÁC MÓN NƯỚNG", name: "Tôm tươi", price: 89000 },
            { category: "CÁC MÓN NƯỚNG", name: "Mực rụng trứng", price: 89000 },
            { category: "CÁC MÓN NƯỚNG", name: "Bạch tuộc nướng xa tê", price: 79000 },
            { category: "CÁC MÓN NƯỚNG", name: "Xúc xích ướp ngũ vị", price: 59000 },
            { category: "CÁC MÓN NƯỚNG", name: "Dồi sụn ướp ngũ vị", price: 59000 },
            { category: "CÁC MÓN NƯỚNG", name: "Lạp xưởng nướng thượng hạng", price: 59000 },
            { category: "CÁC MÓN NƯỚNG", name: "Dải thăn bò nướng tảng", price: 79000 },
            { category: "CÁC MÓN NƯỚNG", name: "Nạc vai nướng tảng", price: 69000 },
            { category: "CÁC MÓN NƯỚNG", name: "Bò ăn dỏi lăn", price: 79000 },
            { category: "CÁC MÓN NƯỚNG", name: "U bò nướng", price: 89000 },
            { category: "CÁC MÓN NƯỚNG", name: "Rẻ sườn nướng xa tê", price: 69000 },
            { category: "CÁC MÓN NƯỚNG", name: "Bắp bò ướp ngũ vị", price: 79000 },
            { category: "ĐỒ UỐNG", name: "Rượu ngô non, táo mèo", price: 40000 },
            { category: "ĐỒ UỐNG", name: "Bia Sài Gòn / 333", price: 15000 },
            { category: "ĐỒ UỐNG", name: "Bia Tiger", price: 22000 },
            { category: "ĐỒ UỐNG", name: "Bò húc", price: 17000 },
            { category: "ĐỒ UỐNG", name: "Nước lọc", price: 7000 },
            { category: "ĐỒ UỐNG", name: "Trà đá / Thuốc lá", price: 20000 },
            { category: "ĐỒ UỐNG", name: "Rượu dừa", price: 65000 },
            { category: "ĐỒ UỐNG", name: "Nước ngọt các loại", price: 13000 }
        ];

        const foodGrid = document.getElementById('foodGrid');
        let tableRounds = {}; // Lưu danh sách các lượt theo từng bàn

        menuList.forEach(item => {
            let card = document.createElement('div');
            card.className = 'food-card';
            card.onclick = () => addItem(item.name, item.price);
            card.innerHTML = `<div class="food-name">${item.name}</div><div class="food-price">${(item.price/1000).toFixed(0)}k</div>`;
            foodGrid.appendChild(card);
        });

        function changeTable() {
            renderBill();
        }

        function addItem(name, price) {
            let table = document.getElementById('selectedTable').value;
            if(!table) { alert('⚠️ Vui lòng chọn bàn ở phía trên trước!'); return; }
            
            if(!tableRounds[table]) {
                tableRounds[table] = [{ round: 1, items: [] }];
            }
            let rounds = tableRounds[table];
            let activeRound = rounds[rounds.length - 1]; // Lấy lượt mới nhất đang chọn

            let found = activeRound.items.find(i => i.name === name);
            if(found) found.quantity++; else activeRound.items.push({name, price, quantity: 1});
            renderBill();
        }

        function submitNewRound() {
            let table = document.getElementById('selectedTable').value;
            if(!table || !tableRounds[table]) { alert('Chưa có món nào để chốt lượt!'); return; }
            let rounds = tableRounds[table];
            let activeRound = rounds[rounds.length - 1];
            if(activeRound.items.length === 0) { alert('Lượt hiện tại đang trống!'); return; }

            // Tạo lượt mới tiếp theo
            rounds.push({ round: rounds.length + 1, items: [] });
            renderBill();
            alert('🚀 Đã chốt lượt gọi món thành công! Bếp đã nhận được order.');
        }

        function renderBill() {
            let table = document.getElementById('selectedTable').value;
            const box = document.getElementById('billContent');
            if(!table || !tableRounds[table] || tableRounds[table].every(r => r.items.length === 0)) {
                box.innerHTML = '<p style="color: #aaa; text-align: center; margin-top: 15px; font-size: 11px;">Chưa có món nào</p>';
                document.getElementById('totalPrice').innerText = '0đ';
                document.getElementById('currentRoundText').innerText = 'Lượt 1';
                return;
            }

            let rounds = tableRounds[table];
            document.getElementById('currentRoundText').innerText = 'Lượt ' + rounds.length;

            let html = '', total = 0;
            rounds.forEach(r => {
                if(r.items.length > 0) {
                    html += `<div class="round-title">Lượt ${r.round}</div>`;
                    r.items.forEach(i => {
                        let sub = i.price * i.quantity;
                        total += sub;
                        html += `<div style="display:flex; justify-content:space-between; margin: 3px 0; font-size:11px;">
                            <span>${i.name} x${i.quantity}</span>
                            <span><b>${sub.toLocaleString()}đ</b></span>
                        </div>`;
                    });
                }
            });
            box.innerHTML = html;
            document.getElementById('totalPrice').innerText = total.toLocaleString() + 'đ';
        }

        async function checkout() {
            let table = document.getElementById('selectedTable').value;
            if(!table || !tableRounds[table]) { alert('Chưa chọn bàn thanh toán!'); return; }
            
            // Gộp toàn bộ các lượt lại để thanh toán
            let allItems = [];
            tableRounds[table].forEach(r => { allItems = allItems.concat(r.items); });
            if(allItems.length === 0) { alert('Hóa đơn trống!'); return; }

            let totalAmount = allItems.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            
            if(confirm(`Xác nhận thanh toán ${table} tổng tiền ${totalAmount.toLocaleString()}đ?`)) {
                try {
                    const res = await fetch('/api/checkout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tableName: table, items: allItems, totalAmount })
                    });
                    if(res.ok) {
                        alert('✅ Thanh toán và lưu database thành công!');
                        delete tableRounds[table];
                        renderBill();
                    }
                } catch(e) { alert('Lỗi kết nối server!'); }
            }
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
        function viewRevenue() { window.location.href = '/api/orders'; }
    </script>
</body>
</html>
